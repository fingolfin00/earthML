[project]
name = "earthml"
version = "0.2.0"
description = "A library to train ML models from Earth science datasets"
readme = "README.md"
authors = [
    { name = "Jacopo Dall'Aglio", email = "fingolfin00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cf-xarray>=0.10.9",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.43.0",
    "colorlog>=6.10.1",
    "dask>=2026.1.2",
    "earthkit-data[all]>=0.19.0",
    "joblib>=1.5.2",
    "lightning[extra]>=2.5.5",
    "matplotlib>=3.10.7",
    "rich>=14.2.0",
    "scipy>=1.16.2",
    # Index selection happens in [tool.uv.sources]
    "torch==2.6.0",
    "torch-geometric>=2.7.0",
    "torchaudio==2.6.0",
    "torchmetrics>=1.3.1",
    "torchvision>=0.21.0",
    "netCDF4>=1.7.4",
    "h5netcdf>=1.8.1",
    "h5py>=3.15.1",
    "xarray[complete]>=2026.02.0",
    "esmpy==8.9.1",
    "xesmf>=0.8.10",
    "copernicusmarine>=2.3.0",
    "timm>=1.0.28",
]

[project.optional-dependencies]
cuda = [
    # Won't install on macOS (including Apple Silicon)
    "nvidia-cuda-runtime-cu11>=11.8.89; sys_platform != 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://pypi.org/simple"
index-strategy = "unsafe-best-match"

# CUDA wheels index (Linux/Windows typically)
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

# CPU / macOS wheels index (used on Darwin to not pull CUDA builds)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Git source for esmpy
esmpy = { git = "https://github.com/esmf-org/esmf.git", tag = "v8.9.1", subdirectory = "src/addon/esmpy" }

# Per-platform torch-family routing:
# - macOS (Apple Silicon + Intel): CPU/macOS wheels, no CUDA deps
# - non-macOS: CUDA wheels from cu118 index
torch = [
  { index = "pytorch-cpu",  marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu",  marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu",  marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "cdsapi>=0.7.7",
    "dask-gateway>=2025.4.0",
    "dask-gateway-server[local]>=2025.4.0",
    "dask-jobqueue>=0.9.0",
    "ecmwf-datastores-client>=0.4.1",
    "geoviews>=1.14.1",
    "hvplot>=0.12.1",
    "ipykernel>=7.1.0",
    "ipympl>=0.9.8",
    "ipywidgets>=8.1.7",
    "ipywidgets-bokeh>=1.0.2",
    "jupyter-bokeh>=4.0.5",
    "jupyterlmod>=5.3.0",
    "openeo>=0.39.1",
    "panel>=1.8.2",
    "pyviz-comms>=3.0.6",
    "selenium>=4.38.0",
    "tensorboard>=2.21.0",
    "xskillscore>=0.0.27",
    "threadpool>=1.3.2",
    "threadpoolctl>=3.6.0",
    "global-land-mask>=1.0.0",
    "zarrdump>=0.7.1",
]
